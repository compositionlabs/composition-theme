<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shader options — metal production</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: #2a3437;
    color: #ebf1f1;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    padding: 2rem;
  }
  h1 { font-size: 1.1rem; font-weight: 500; margin-bottom: 0.25rem; }
  p.hint { color: #aeb8b8; font-size: 0.8rem; margin-bottom: 1.5rem; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
    gap: 1.25rem;
  }
  .tile { border: 1px solid #455153; background: #344042; }
  .tile canvas { display: block; width: 100%; height: 300px; }
  .tile .meta { padding: 0.75rem 1rem; }
  .tile .meta strong { color: #26b5bd; font-weight: 600; font-size: 0.85rem; }
  .tile .meta span { display: block; color: #aeb8b8; font-size: 0.75rem; margin-top: 0.25rem; line-height: 1.5; }
  .tile .err { color: #ed6857; font-size: 0.7rem; padding: 0 1rem 0.75rem; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Metal-production shader options</h1>
<p class="hint">Each tile is live WebGL using the same interface as the site background. To apply one, copy its file over <code>public/shaders/fragment.glsl</code>.</p>
<div class="grid" id="grid"></div>

<script>
const OPTIONS = [
  { file: "/shaders/fragment.glsl", name: "Current — applied background", desc: "Whatever public/shaders/fragment.glsl holds right now — currently Rolling Mill (no heat band)." },
  { file: "/shaders/options/molten-veins.glsl", name: "A — Molten Veins", desc: "Molten metal flowing through dark cooling slag: thin glowing orange channels with gold cores, drifting slowly downward." },
  { file: "/shaders/options/rolling-mill.glsl", name: "B — Rolling Mill", desc: "Brushed-steel sheet sliding through the mill: anisotropic grain, a sweeping teal sheen, and a faint residual heat band." },
  { file: "/shaders/options/forge-embers.glsl", name: "C — Forge Embers", desc: "Sparks rising off the melt in three parallax layers over a breathing furnace glow, cooling into teal air." },
  { file: "/shaders/options/temper-sheen.glsl", name: "D — Temper Sheen", desc: "Iridescent oxide colors of heat-treated steel: slate through teal and gold to an ember edge, slowly rotating." },
];

async function boot() {
  const vertexSrc = await (await fetch("/shaders/vertex.glsl")).text();
  const grid = document.getElementById("grid");

  for (const opt of OPTIONS) {
    const tile = document.createElement("div");
    tile.className = "tile";
    const canvas = document.createElement("canvas");
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.innerHTML = `<strong>${opt.name}</strong><span>${opt.desc}<br><code>${opt.file}</code></span>`;
    tile.appendChild(canvas);
    tile.appendChild(meta);
    grid.appendChild(tile);

    try {
      const fragSrc = await (await fetch(opt.file)).text();
      run(canvas, vertexSrc, fragSrc);
    } catch (e) {
      const err = document.createElement("div");
      err.className = "err";
      err.textContent = String(e);
      tile.appendChild(err);
    }
  }
}

function compile(gl, type, src) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, src);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
    throw new Error(gl.getShaderInfoLog(shader));
  }
  return shader;
}

function run(canvas, vertexSrc, fragSrc) {
  const gl = canvas.getContext("webgl");
  if (!gl) throw new Error("WebGL not supported");

  const program = gl.createProgram();
  gl.attachShader(program, compile(gl, gl.VERTEX_SHADER, vertexSrc));
  gl.attachShader(program, compile(gl, gl.FRAGMENT_SHADER, fragSrc));
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    throw new Error(gl.getProgramInfoLog(program));
  }
  gl.useProgram(program);

  const buffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(program, "a_position");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  const timeLoc = gl.getUniformLocation(program, "u_time");
  const resLoc = gl.getUniformLocation(program, "u_resolution");

  function frame(now) {
    if (canvas.width !== canvas.clientWidth || canvas.height !== canvas.clientHeight) {
      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;
    }
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform1f(timeLoc, now * 0.001);
    gl.uniform2f(resLoc, canvas.width, canvas.height);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

boot();
</script>
</body>
</html>
